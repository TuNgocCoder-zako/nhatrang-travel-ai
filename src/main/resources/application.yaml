server:
  port: 8080

spring:
  application:
    name: tourism-backend

  datasource:
    url: jdbc:mysql://localhost:3306/nhatrang_tourism?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    deepseek:
      api-key: dummy-key