services:
  mysql:
    image: mysql:8.0
    container_name: nhatrang-tourism-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nhatrang_tourism
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data: